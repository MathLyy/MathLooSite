# --- SYNTAX GUIDE ---
# 1. Random Count: "2-4*Car.png" (Adds 2, 3, or 4 cars)
# 2. Random Choice: "CarA.png|CarB.png" (Randomly picks CarA OR CarB)
# 3. Directional: "Left.png>Right.png" (Uses Left.png for L, Right.png for R)
# 4. Shuffle: "SHUFFLE{CarA.png, CarB.png}" (Randomizes order. If combined with count, count is the TOTAL number of items drawn from the shuffled pool)
# 5. Combined: "2-3*SHUFFLE{CarA.png>CarA_R.png|CarB.png, CarC.png}"
# 6. Locomotive Change: Add 'loco_change: "NewLoco.png"' to the 'stop' config.
#    Optional: 'detach_count: N' to detach N elements (default 1).
# 7. Custom Track: Add 'track: "track_image.png"' to use a specific track for this train.
# 8. Foreground: Add 'foreground: "image.png"' or full config (see docs).

